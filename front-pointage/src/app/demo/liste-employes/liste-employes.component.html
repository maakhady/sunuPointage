<div class="container mt-4">
    <ul class="list-unstyled">
      <li class="pc-h-item d-none d-md-inline-flex">
        <i class="search f-12" antIcon type="search" theme="outline"></i>
        <input
          type="search"
          [(ngModel)]="searchQuery"
          (input)="onSearch()"
          placeholder="Rechercher par nom, prénom ou email"
          class="form-control"
        >
      </li>
    </ul>
  
    <div class="d-flex flex-column flex-md-row justify-content-between align-items-start mb-4">
      <h2 class="bleu">Liste des Employés</h2>
      <div class="d-flex bloc flex-column flex-md-row">
       
        
        <button class="btn btn-primary me-3 mb-2 mb-md-0" (click)="toggleSelectAll()">
          {{ allSelected ? 'Désélectionner tout' : 'Sélectionner tout' }}
        </button>
      </div>
      <div>
        <button class="btn btn-danger me-2" [disabled]="!hasSelectedEmployes()" (click)="onActionSelected()">
          Supprimer
        </button>
      </div>
    </div>
  
    <div class="table-responsive">
      <table class="table table-hover">
        <thead>
          <tr>
            <th>
              <input type="checkbox" 
                     [checked]="allSelected" 
                     (change)="toggleSelectAll()"
                     class="form-check-input">
            </th>
            <th>Matricule</th>
            <th>Prénom</th>
            <th>Nom</th>
            <th>Email</th>
            <th>Téléphone</th>
            <th>Fonction</th>
            <th>Adresse</th>
            <th>Actions</th>
          </tr>
        </thead>
        <tbody>
          <tr *ngFor="let employe of paginatedEmployes">
            <td>
              <input type="checkbox" 
                     [(ngModel)]="employe.selected"
                     (change)="onSelectionChange()"
                     class="form-check-input">
            </td>
            <td>{{employe.matricule}}</td>
            <td>{{employe.prenom}}</td>
            <td>{{employe.nom}}</td>
            <td>{{employe.email}}</td>
            <td>{{employe.telephone}}</td>
            <td>{{employe.fonction}}</td>
            <td>{{employe.adresse}}</td>
            <td>
              <button class="btn btn-link text-secondary p-0 me-2" (click)="editEmploye(employe)">
                <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor" class="bi bi-pencil-square" viewBox="0 0 16 16">
                  <path d="M15.502 1.94a.5.5 0 0 1 0 .706L14.459 3.69l-2-2L13.502.646a.5.5 0 0 1 .707 0l1.293 1.293zm-1.75 2.456-2-2L4.939 9.21a.5.5 0 0 0-.121.196l-.805 2.414a.25.25 0 0 0 .316.316l2.414-.805a.5.5 0 0 0 .196-.12l6.813-6.814z"/>
                  <path fill-rule="evenodd" d="M1 13.5A1.5 1.5 0 0 0 2.5 15h11a1.5 1.5 0 0 0 1.5-1.5v-6a.5.5 0 0 0-1 0v6a.5.5 0 0 1-.5.5h-11a.5.5 0 0 1-.5-.5v-11a.5.5 0 0 1 .5-.5H9a.5.5 0 0 0 0-1H2.5A1.5 1.5 0 0 0 1 2.5z"/>
                </svg>
              </button>
              <button class="btn btn-link text-danger me-2 p-0" (click)="deleteEmploye(employe.id)">
                <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor" class="bi bi-trash" viewBox="0 0 16 16">
                  <path d="M5.5 5.5A.5.5 0 0 1 6 6v6a.5.5 0 0 1-1 0V6a.5.5 0 0 1 .5-.5m2.5 0a.5.5 0 0 1 .5.5v6a.5.5 0 0 1-1 0V6a.5.5 0 0 1 .5-.5m3 .5a.5.5 0 0 0-1 0v6a.5.5 0 0 0 1 0z"/>
                  <path d="M14.5 3a1 1 0 0 1-1 1H13v9a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V4h-.5a1 1 0 0 1-1-1V2a1 1 0 0 1 1-1H6a1 1 0 0 1 1-1h2a1 1 0 0 1 1 1h3.5a1 1 0 0 1 1 1zM4.118 4 4 4.059V13a1 1 0 0 0 1 1h6a1 1 0 0 0 1-1V4.059L11.882 4zM2.5 3h11V2h-11z"/>
                </svg>
              </button>
              <button class="btn btn-link text-secondary me-2 p-0" (click)="viewEmployeDetails(employe)">
                <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor" class="bi bi-eye-fill" viewBox="0 0 16 16">
                  <path d="M10.5 8a2.5 2.5 0 1 1-5 0 2.5 2.5 0 0 1 5 0"/>
                  <path d="M0 8s3-5.5 8-5.5S16 8 16 8s-3 5.5-8 5.5S0 8 0 8m8 3.5a3.5 3.5 0 1 0 0-7 3.5 3.5 0 0 0 0 7"/>
                </svg>
              </button>
            </td>
          </tr>
        </tbody>
      </table>
    </div>
  
    <nav aria-label="Page navigation">
      <ul class="pagination">
        <li class="page-item" [class.disabled]="currentPage === 1">
          <a class="page-link" (click)="currentPage = currentPage - 1" aria-label="Previous">
            <span aria-hidden="true">&laquo;</span>
          </a>
        </li>
        <li class="page-item" *ngFor="let page of [].constructor(totalPages); let i = index" [class.active]="currentPage === i + 1">
          <a class="page-link" (click)="currentPage = i + 1">{{ i + 1 }}</a>
        </li>
        <li class="page-item" [class.disabled]="currentPage === totalPages">
          <a class="page-link" (click)="currentPage = currentPage + 1" aria-label="Next">
            <span aria-hidden="true">&raquo;</span>
          </a>
        </li>
      </ul>
    </nav>
  </div>
