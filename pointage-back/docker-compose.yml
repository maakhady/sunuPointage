version: '3'
services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    working_dir: /var/www/
    volumes:
      - ./:/var/www
    environment:
      MONGO_DB_HOST: ${MONGO_DB_HOST}  # À configurer dans Railway
      MONGO_DB_PORT: ${MONGO_DB_PORT}
      MONGO_DB_DATABASE: ${MONGO_DB_DATABASE}
    networks:
      - pointage_net

  nginx:
    image: nginx:alpine
    restart: unless-stopped
    ports:
      - "${PORT}:80"  # Railway fournit la variable PORT
    volumes:
      - ./:/var/www
      - ./docker/nginx/conf.d:/etc/nginx/conf.d/
    depends_on:
      - app
    networks:
      - pointage_net

networks:
  pointage_net:
    driver: bridge
